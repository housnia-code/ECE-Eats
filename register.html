<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ECE Eats – Register</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/entry.css">
</head>
<body class="auth-page" data-page="register">

  <main class="auth">
    <div class="auth__photo" role="img" aria-label="Table full of dishes"></div>

    <section class="auth__panel">
      <div class="auth-card">
        <p class="auth-card__logo">ECE EATS</p>

        <form id="register-form" class="auth-form" novalidate>
          <h1 class="auth-card__title">Register</h1>

          <div class="field">
            <label for="reg-name">Full Name</label>
            <input class="input" type="text" id="reg-name" placeholder="Name" autocomplete="name">
            <p class="field__error" id="reg-name-error"></p>
          </div>

          <div class="field">
            <label for="reg-email">Student Email</label>
            <input class="input" type="email" id="reg-email" placeholder="Student email" autocomplete="email">
            <p class="field__error" id="reg-email-error"></p>
          </div>

          <div class="field">
            <label for="reg-phone">Phone number</label>
            <input class="input" type="tel" id="reg-phone" placeholder="Phone number" autocomplete="tel">
            <p class="field__error" id="reg-phone-error"></p>
          </div>

          <div class="field">
            <label for="reg-password">Password</label>
            <input class="input" type="password" id="reg-password" placeholder="Password" autocomplete="new-password">
            <p class="field__error" id="reg-password-error"></p>
          </div>

          <button type="submit" class="btn btn--primary btn--block auth-card__submit">Register</button>

          <div class="auth-card__links">
            <a href="index.html">Already have an account? Login</a>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script src="js/entry.js"></script>
</body>
</html>
