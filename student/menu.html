<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ECE Eats campus food pre-ordering">
  <title>ECE Eats | Menu</title>
  <link rel="stylesheet" href="../css/style.css?v=3">
  <link rel="stylesheet" href="../css/student.css?v=3">
</head>
<body data-page="menu" data-nav="cafeterias" data-auth="student">
  <header id="site-header"></header>

  <main class="container">
    <section class="view">
      <div class="breadcrumb"><a href="../main/cafeterias.html">Cafeterias</a> <span>›</span> <span id="crumbName">Le CROUS Express</span></div>

      <section class="cafeteria-heading">
        <div>
          <h1 id="cafeName"></h1>
          <p class="location" id="cafeLocation"></p>
          <p class="description" id="cafeDesc"></p>
        </div>
        <div class="cafeteria-badges">
          <span class="pill peach" id="badgeOpen"></span>
          <span class="pill peach" id="badgeCampus"></span>
          <span class="pill green" id="badgeWait"></span>
        </div>
      </section>

      <div class="category-bar" id="categoryBar"></div>

      <div class="ordering-layout">
        <section class="menu-list" aria-label="Menu items"><div id="menuGroups"></div></section>
        <aside class="tray-panel" id="trayPanel">
          <div class="tray-heading"><h2>♧ Your tray</h2><span id="trayItemCount">0 items</span></div>
          <div id="trayItems" class="tray-items"><p class="empty-state">Your tray is empty. Add something delicious!</p></div>
          <div class="tray-total"><strong>TOTAL to pay:</strong><strong id="trayTotal">0,00 €</strong></div>
          <button type="button" class="btn btn-dark full-width" id="goCheckout" disabled>Checkout</button>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../js/common.js?v=3"></script>
  <script src="../js/student.js?v=3"></script>
</body>
</html>
